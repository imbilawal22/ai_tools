name: Mindora AI - Automated Evolving AI Tools Pipeline

on:
  push:
    branches:
      - main
  schedule:
    # 9:00 AM PKT (04:00 UTC) and 6:00 PM PKT (13:00 UTC) every day
    - cron: '0 4,13 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'mindora-pipeline'
  cancel-in-progress: false

jobs:
  research-and-update:
    name: Global AI Research & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Global AI Research Probe
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/fetch_ai_tools.py

      - name: Commit and Publish Updated AI Tools
        run: |
          git config --global user.name "Mindora AI Bot"
          git config --global user.email "bot@mindora.ai"
          git add js/data.js
          
          if git diff --staged --quiet; then
            echo "No new tools added in this cycle. Catalog is already up to date."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "Auto-update: Global AI tools catalog ($TIMESTAMP) [skip ci]"
            git push origin main
            echo "Successfully committed and pushed new evolving AI tools."
          fi

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: research-and-update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
